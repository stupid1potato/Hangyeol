name: engine

on:
  push:
    paths:
      - "engine/**"
      - "fixtures/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "fixtures/**"
      - ".github/workflows/engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Test hangyeol_engine
        run: cargo test --manifest-path engine/Cargo.toml
